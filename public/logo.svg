<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">ProofBox Icon</title>

  <!-- Fond sombre arrondi (plein, recommandé pour iOS) -->
  <rect width="512" height="512" rx="100" fill="#2C2C2C"></rect>

  <!-- Boîte verte -->
  <path d="M130 200 L256 120 L382 200 L382 360 L256 440 L130 360 Z" fill="#00A878"></path>
  <!-- côté gauche (ombrage) -->
  <path d="M130 200 L256 280 L256 440 L130 360 Z" fill="#009368"></path>
  <!-- côté droit (ombrage) -->
  <path d="M382 200 L256 280 L256 440 L382 360 Z" fill="#007F58"></path>

  <!-- Feuille (légèrement grisée pour lisibilité) -->
  <rect x="186" y="140" width="140" height="180" rx="10" fill="#F2F2F2"></rect>
  <rect x="210" y="170" width="92" height="18" rx="4" fill="#00A878"></rect>
  <rect x="210" y="200" width="92" height="18" rx="4" fill="#00A878"></rect>

  <!-- Badge rond vert + check -->
  <g transform="translate(0,6)">
    <!-- cercle -->
    <circle cx="256" cy="330" r="80" fill="#00A878"></circle>
    <!-- léger ombrage interne (optionnel) -->
    <circle cx="256" cy="330" r="80" fill="url(#shade)"></circle>
    <!-- check -->
    <path d="M214 330 L244 360 L308 286" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  <!-- dégradé d’ombre très subtil pour donner un peu de relief au badge -->
  <defs>
    <radialGradient id="shade" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"></stop>
      <stop offset="100%" stop-color="rgba(0,0,0,0.10)"></stop>
    </radialGradient>
  </defs>
</svg>
